# PostgreSQL profile for the existing gateway, Panel and SDK APIs.
# Fill the explicit embedding settings via environment; no local model downloads.
deployMode: standalone
instanceId: "${TDAI_INSTANCE_ID:-default}"
stateBackend: postgres
server:
  host: 0.0.0.0
  port: 8420
  apiKey: "${TDAI_GATEWAY_API_KEY}"
data:
  baseDir: /data/tdai-memory
  fileStore: rowfs
  fileStoreOthers: postgres
memory:
  storeBackend: postgres
  capture:
    enabled: true
  recall:
    enabled: true
    strategy: hybrid
  embedding:
    enabled: true
    provider: openai
    endpoint: "${MEMORY_EMBEDDING_ENDPOINT}" # Complete URL, no suffix appended.
    format: "${MEMORY_EMBEDDING_FORMAT}" # openai or ark-multimodal
    baseUrl: "${MEMORY_EMBEDDING_BASE_URL}" # Legacy fallback only; endpoint wins.
    apiKey: "${MEMORY_EMBEDDING_API_KEY}"
    model: "${MEMORY_EMBEDDING_MODEL}"
    dimensions: 1536 # Set to the provider's real output dimension before startup.
    sendDimensions: false
  bm25:
    enabled: false # PG full-text remains enabled; no sparse-vector encoder needed.
  extraction:
    enabled: false # Enable only after explicitly configuring the existing LLM path.
worker:
  concurrency: 2
skill:
  enabled: true
  storeBackend: postgres
  contentBackend: postgres
  routing:
    mode: bm25
  extraction:
    enabled: false
  worker:
    concurrency: 2
# Independent OpenAI OAuth is opt-in; follow ../OAUTH.md. No paid-key LLM fallback is configured here.
# To retain an existing explicitly configured LLM, copy your llm block and enable
# memory.extraction / skill.extraction deliberately. Embedding and LLM keys differ.
