# One component / one container. Run separately; do not merge with -f.
# See INSTALL_CN.md for network setup, startup order and existing-volume migration.
name: agentmemory-core
services:
  core:
    build: ./MemoryCore
    ports:
    - 127.0.0.1:8420:8420
    environment:
      STORE_MODE: postgres
      STATE_BACKEND: postgres
      FILE_STORE_MODE: rowfs
      FILE_STORE_OTHERS: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password outside Git}
      AGENTMEMORY_DB_CONFIG: /app/config/db.toml
      TDAI_GATEWAY_API_KEY: ${TDAI_GATEWAY_API_KEY:?Set a gateway key outside Git}
      TDAI_INSTANCE_ID: ${TDAI_INSTANCE_ID:-default}
      MEMORY_EMBEDDING_ENDPOINT: ${MEMORY_EMBEDDING_ENDPOINT:-}
      MEMORY_EMBEDDING_FORMAT: ${MEMORY_EMBEDDING_FORMAT:-openai}
      MEMORY_EMBEDDING_BASE_URL: ${MEMORY_EMBEDDING_BASE_URL:-}
      MEMORY_EMBEDDING_API_KEY: ${MEMORY_EMBEDDING_API_KEY:?Set an embedding API key outside Git}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:?Set the embedding model}
      WORKER_CONCURRENCY: 2
      TDAI_SKILL_WORKER_CONCURRENCY: 2
    volumes:
    - type: bind
      source: ./config/db.toml
      target: /app/config/db.toml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./MemoryCore/tdai-gateway.postgres.yaml
      target: /data/config/tdai-gateway.yaml
      read_only: true
      bind:
        create_host_path: false
    - core-work-cache:/data/tdai-memory
    restart: unless-stopped
    networks:
      shared:
        aliases:
        - core
networks:
  shared:
    external: true
    name: ${AGENTMEMORY_NETWORK:-agentmemory}
volumes:
  core-work-cache: {}
