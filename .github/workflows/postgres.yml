name: PostgreSQL migration
on:
  workflow_dispatch:
  push:
    branches: [main, feat/postgres-migration, feat/independent-oauth]
  pull_request:
permissions:
  contents: read
concurrency:
  group: postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [MemoryCore, MemoryKnowledge, MemoryPanel, MemoryProxy]
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: agentmemory_test
          POSTGRES_PASSWORD: test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d agentmemory_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_TEST_URL: postgresql://postgres:test-only@127.0.0.1:5432/agentmemory_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared database loader copies
        run: node scripts/sync-db-config.mjs --check
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Initialize pgvector once before concurrent suites
        run: psql "$PG_TEST_URL" -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: Install Core dependencies without host agents or local models
        if: matrix.module == 'MemoryCore'
        working-directory: MemoryCore
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Core PostgreSQL contracts, migration and gateway wiring
        if: matrix.module == 'MemoryCore'
        working-directory: MemoryCore
        run: |
          npm run typecheck:postgres
          npm run test:postgres
          npm run typecheck:oauth
          npm run test:oauth
          npx vitest run src/db-config.test.ts src/core/store/tokenize.test.ts src/utils/checkpoint.test.ts src/core/checkpoint-startup.test.ts
          npm run build:plugin
      - name: Install Knowledge dependencies and native derived graph index
        if: matrix.module == 'MemoryKnowledge'
        working-directory: MemoryKnowledge
        run: |
          npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3
      - name: Knowledge PostgreSQL, source restore and CodeGraph integration
        if: matrix.module == 'MemoryKnowledge'
        working-directory: MemoryKnowledge
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Panel PostgreSQL identities, templates and import
        if: matrix.module == 'MemoryPanel'
        working-directory: MemoryPanel
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
      - name: Proxy PostgreSQL state, limits, turns and import
        if: matrix.module == 'MemoryProxy'
        working-directory: MemoryProxy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3
          npm run typecheck
          npm test
