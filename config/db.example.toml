# Copy to config/db.toml (gitignored). No password is stored in this file.
# For native processes change postgres to the actual reachable database host.
[postgres]
url = "postgresql://agentmemory@postgres:5432/agentmemory"
password_env = "POSTGRES_PASSWORD"

# Optional complete URL from the process environment instead (do not combine
# url_env with url/password_env in the same section):
# [panel]
# url_env = "PANEL_DATABASE_URL"
# [core]
# metadata_url_env = "CORE_METADATA_DATABASE_URL"
# Module overrides replace the shared URL AND its password reference.
