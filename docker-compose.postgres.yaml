# One component / one container. Run separately; do not merge with -f.
# See INSTALL_CN.md for network setup, startup order and existing-volume migration.
name: agentmemory-postgres
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentmemory
      POSTGRES_USER: agentmemory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password outside Git}
    volumes:
    - agentmemory-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U agentmemory -d agentmemory
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks:
      shared:
        aliases:
        - postgres
networks:
  shared:
    external: true
    name: ${AGENTMEMORY_NETWORK:-agentmemory}
volumes:
  agentmemory-postgres:
    external: true
    name: ${POSTGRES_VOLUME:?Set POSTGRES_VOLUME to the confirmed database volume name}
